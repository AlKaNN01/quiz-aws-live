# Local test nginx — HTTP only, SSL yok
# Kullanım: docker-compose.local.yml ile birlikte gelir

upstream gameadmin  { server gameadmin:8081;  keepalive 16; }
upstream gameengine { server gameengine:8080; keepalive 16; }
upstream frontend   { server frontend:3000;   keepalive 16; }

server {
    listen 80;
    server_name localhost;

    # ── Sağlık kontrolü ────────────────────────────────────
    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── Frontend (React) ────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # SPA: 404'ü index.html'e düşür
        error_page 404 =200 /index.html;
    }

    # ── REST API — Auth ─────────────────────────────────────
    location /api/auth/ {
        proxy_pass http://gameadmin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── REST API — Games ────────────────────────────────────
    location /api/ {
        proxy_pass http://gameadmin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_pass_header Authorization;
        proxy_set_header Connection        "";
    }

    # ── WebSocket (SockJS + STOMP) ──────────────────────────
    location /ws {
        proxy_pass http://gameengine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # ── Actuator ────────────────────────────────────────────
    location /actuator/health {
        proxy_pass http://gameadmin;
        proxy_set_header Host $host;
        access_log off;
    }
}
