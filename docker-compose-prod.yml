version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: quiz-db
    environment:
      POSTGRES_DB: gameadmin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - quiz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: quiz-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - quiz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GameAdmin Spring Boot
  game-admin:
    build:
      context: ./GameAdmin
      dockerfile: Dockerfile
    container_name: quiz-admin-app
    environment:
      SPRING_PROFILES_ACTIVE: ${ENVIRONMENT:-development}
      DB_URL: jdbc:postgresql://postgres:5432/gameadmin
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      ENGINE_TOKEN: ${ENGINE_TOKEN:-dev-engine-token-change-in-prod}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quiz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # GameEngine Spring Boot
  game-engine:
    build:
      context: ./GameEngine_src
      dockerfile: Dockerfile
    container_name: quiz-engine-app
    environment:
      SPRING_PROFILES_ACTIVE: ${ENVIRONMENT:-development}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      ENGINE_TOKEN: ${ENGINE_TOKEN:-dev-engine-token-change-in-prod}
      GAME_ADMIN_URL: http://game-admin:8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - quiz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  frontend:
    build:
      context: ./quiz-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:-ws://localhost}
    container_name: quiz-frontend-app
    ports:
      - "3000:3000"
    depends_on:
      - game-admin
      - game-engine
    networks:
      - quiz-network
    restart: unless-stopped

  # Nginx Reverse Proxy + SSL
  nginx:
    image: nginx:alpine
    container_name: quiz-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certs:/etc/nginx/certs:ro
      - ./data/logs/nginx:/var/log/nginx
    depends_on:
      - game-admin
      - game-engine
      - frontend
    networks:
      - quiz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  quiz-network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  nginx_logs:
