# Local load test ortamı — HTTP only, portlar doğrudan expose
# Kullanım:
#   cp .env.local .env
#   docker-compose -f docker-compose.local.yml up --build

services:

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - localnet

  postgres:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB:       gameadmin
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - localnet

  gameadmin:
    build: ./GameAdmin
    restart: always
    # Bot scripti doğrudan 8081'e bağlanır (nginx bypass)
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      DB_URL:          ${DB_URL}
      DB_USER:         ${DB_USER}
      DB_PASSWORD:     ${DB_PASSWORD}
      JWT_SECRET:      ${JWT_SECRET}
      ENGINE_TOKEN:    ${ENGINE_TOKEN}
      ADMIN_PASSWORD:  ${ADMIN_PASSWORD}
      HOST_PASSWORD:   ${HOST_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JPA_DDL_AUTO:    ${JPA_DDL_AUTO:-update}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - localnet

  gameengine:
    build: ./GameEngine_src
    restart: always
    # Bot scripti doğrudan 8080'e bağlanır
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      REDIS_HOST:      redis
      REDIS_PORT:      6379
      GAME_ADMIN_URL:  http://gameadmin:8081
      JWT_SECRET:      ${JWT_SECRET}
      ENGINE_TOKEN:    ${ENGINE_TOKEN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      redis:
        condition: service_healthy
      gameadmin:
        condition: service_started
    networks:
      - localnet

  frontend:
    build:
      context: ./quiz-frontend
      args:
        REACT_APP_API_URL: http://localhost/api
        REACT_APP_WS_URL:  ws://localhost/ws
    restart: always
    expose:
      - "3000"
    depends_on:
      - gameadmin
      - gameengine
    networks:
      - localnet

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - gameadmin
      - gameengine
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - localnet

volumes:
  postgres_local:

networks:
  localnet:
    driver: bridge
