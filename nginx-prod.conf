# Production-ready nginx configuration
# HTTPS with HTTP/2, gzip, caching, security headers

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
include /etc/nginx/mime.types;
default_type application/octet-stream;
sendfile on;
tcp_nopush on;
tcp_nodelay on;

# Rate limiting
limit_req_zone $binary_remote_addr zone=authzone:10m rate=5r/s;

upstream gameadmin {
    server gameadmin:8081;
    keepalive 32;
}

upstream gameengine {
    server gameengine:8080;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    # Health check endpoint (without redirect)
    location /healthz {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
    
    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server (primary)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Replace with your domain
    server_name quiz.awsccokan.com;

    # SSL certificates
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_trusted_certificate /etc/nginx/certs/chain.crt;  # For OCSP stapling

    # ========================
    # SSL Configuration (Production)
    # ========================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ========================
    # Security Headers
    # ========================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss: https://cloudflareinsights.com; img-src 'self' data: https:" always;

    # ========================
    # Performance Optimization
    # ========================
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml+rss;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;

    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # ========================
    # Frontend (React app)
    # ========================
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Connection "upgrade";
        
        # SPA routing
        error_page 404 =200 /index.html;
        
        # Moderate caching
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Static assets (long cache - fingerprinted by build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Service worker (no cache)
    location = /service-worker.js {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # ========================
    # REST API (GameAdmin)
    # ========================
    # ── Auth (rate limited) ──────────────────────────────────
    location /api/auth/ {
        proxy_pass http://gameadmin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        limit_req zone=authzone burst=10 nodelay;
    }

    # ── Tüm diğer API istekleri ──────────────────────────────
    location /api/ {
        proxy_pass http://gameadmin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_set_header Connection "";
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ========================
    # WebSocket (GameEngine) - WSS
    # ========================
    location /ws {
        proxy_pass http://gameengine;
        proxy_http_version 1.1;
        
        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts (keep alive)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # No buffering for WebSocket
        proxy_buffering off;
        proxy_buffer_size 4k;
        
        # No cache
        expires -1;
        add_header Cache-Control "no-store";
        access_log off;
    }

    # ========================
    # Health checks (monitoring)
    # ========================
    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location /actuator/health {
        proxy_pass http://gameadmin;
        proxy_set_header Host $host;
        access_log off;
    }

    # ========================
    # Metrics (Prometheus)
    # ========================
    location /metrics {
        proxy_pass http://gameadmin;
        proxy_set_header Host $host;
        access_log off;
    }

    # ========================
    # Deny access to sensitive paths
    # ========================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

} # end http
