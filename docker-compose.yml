services:

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  postgres:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: gameadmin
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  gameadmin:
    image: ghcr.io/alkan01/quiz-gameadmin:latest
    restart: always
    expose:
      - "8081"
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ENGINE_TOKEN: ${ENGINE_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      HOST_PASSWORD: ${HOST_PASSWORD}
      ALLOWED_ORIGINS: https://${DOMAIN:-localhost}
    # Both local postgres OR RDS supported
    # If using RDS, postgres container is ignored (depends_on optional)
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - appnet

  gameengine:
    image: ghcr.io/alkan01/quiz-gameengine:latest
    restart: always
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      GAME_ADMIN_URL: http://gameadmin:8081
      JWT_SECRET: ${JWT_SECRET}
      ENGINE_TOKEN: ${ENGINE_TOKEN}
      ALLOWED_ORIGINS: https://${DOMAIN:-localhost}
    depends_on:
      redis:
        condition: service_healthy
      gameadmin:
        condition: service_started
    networks:
      - appnet

  frontend:
    image: ghcr.io/alkan01/quiz-frontend:latest
    restart: always
    expose:
      - "3000"
    depends_on:
      - gameengine
      - gameadmin
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    environment:
      DOMAIN: ${DOMAIN:-yourdomain.com}
    depends_on:
      - frontend
      - gameadmin
      - gameengine
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  appnet:
    driver: bridge
