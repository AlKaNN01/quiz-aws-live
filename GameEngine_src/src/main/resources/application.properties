# Spring Boot Server Configuration
server.port=8081
server.shutdown=graceful

# Spring & Redis Ayatlari
spring.application.name=GameEngine
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# Oyun Motoru Ayarlari
app.game.session-ttl-seconds=7200
app.game.game-ttl-seconds=10800
app.game.ban-ttl-seconds=86400
app.game.score-reveal-delay-ms=2000
app.game.leaderboard-approval-timeout-ms=30000
app.game.next-question-countdown-seconds=5
app.game.question-intro-duration-ms=2000

# Guvenlik (JWT) Ayarlari
# JWT_SECRET env var ZORUNLU — fallback yok. Production'da guclu bir deger set edilmeli.
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-ms=86400000

# CORS — izin verilen origin'ler virgille ayrilir. WebSocket ve REST API icin.
app.allowed-origins=${ALLOWED_ORIGINS}

# GameAdmin Entegrasyonu
app.game-admin.url=${GAME_ADMIN_URL}
# ENGINE_TOKEN env var ZORUNLU — fallback yok. Servisler arasi auth icin kullanilir.
app.game-admin.engine-token=${ENGINE_TOKEN}

# Management / Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true
management.endpoint.shutdown.enabled=true

# Resilience4j Configuration
resilience4j.retry.instances.default.max-attempts=3
resilience4j.retry.instances.default.wait-duration=500
resilience4j.retry.instances.default.retry-exceptions=java.io.IOException,java.net.SocketTimeoutException
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.default.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.default.automatic-transition-from-open-to-half-open-enabled=true

# Loglama Ayarlari — PROD: WARN, DEV: INFO
logging.level.root=INFO
logging.level.com.awsokanclub=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.websocket=INFO
logging.level.org.springframework.data.redis=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/game-engine.log
logging.file.max-size=10MB
logging.file.max-history=30