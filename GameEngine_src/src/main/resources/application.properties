# Spring & Redis Ayatlari
spring.application.name=GameEngine
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# Oyun Motoru Ayarlari
app.game.session-ttl-seconds=7200
app.game.game-ttl-seconds=10800
app.game.ban-ttl-seconds=86400
app.game.score-reveal-delay-ms=2000
app.game.leaderboard-approval-timeout-ms=30000
app.game.next-question-countdown-seconds=5
app.game.question-intro-duration-ms=2000

# Guvenlik (JWT) Ayarlari
# JWT_SECRET env var ZORUNLU — fallback yok. Production'da guclu bir deger set edilmeli.
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-ms=86400000

# CORS — izin verilen origin'ler virgille ayrilir. WebSocket ve REST API icin.
app.allowed-origins=${ALLOWED_ORIGINS}

# GameAdmin Entegrasyonu
app.game-admin.url=${GAME_ADMIN_URL}
# ENGINE_TOKEN env var ZORUNLU — fallback yok. Servisler arasi auth icin kullanilir.
app.game-admin.engine-token=${ENGINE_TOKEN}

# Loglama Ayarlari — PROD: WARN, DEV: INFO
logging.level.com.awsokanclub=INFO