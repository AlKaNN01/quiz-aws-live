name: 🚀 Build & Deploy to EC2

on:
  push:
    branches:
      - LiveBackend
  pull_request:
    branches:
      - LiveBackend
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }}

jobs:
  # Stage 1: Lint & Test
  test:
    name: 🧪 Test & Build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: ['21']
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gameadmin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: ☕ Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven
      
      - name: 🧹 Run GameAdmin tests
        run: |
          cd GameAdmin
          mvn clean test -q

      - name: 🧹 Run GameEngine tests
        run: |
          cd GameEngine_src
          mvn clean test -q
      
      - name: 🔨 Build GameAdmin JAR
        run: |
          cd GameAdmin
          mvn clean package -DskipTests -q
      
      - name: 🔨 Build GameEngine JAR
        run: |
          cd GameEngine_src
          mvn clean package -DskipTests -q
      
      - name: 🌐 Build Frontend
        run: |
          cd quiz-frontend
          npm install --legacy-peer-deps
          npm run build
      
      - name: ✅ Verify Docker builds
        run: |
          docker build -f GameAdmin/Dockerfile -t quiz-admin:test GameAdmin/
          docker build -f GameEngine_src/Dockerfile -t quiz-engine:test GameEngine_src/
          docker build -f quiz-frontend/Dockerfile -t quiz-frontend:test quiz-frontend/

  # Stage 2: Build & Push Docker Images (only on main)
  build:
    name: 📦 Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/LiveBackend' && github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      
      - name: 📦 Build & Push GameAdmin image
        uses: docker/build-push-action@v5
        with:
          context: ./GameAdmin
          file: ./GameAdmin/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/game-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 📦 Build & Push GameEngine image
        uses: docker/build-push-action@v5
        with:
          context: ./GameEngine_src
          file: ./GameEngine_src/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/game-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 📦 Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./quiz-frontend
          file: ./quiz-frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
          build-args: |
            REACT_APP_API_URL=https://${{ secrets.DOMAIN }}
            REACT_APP_WS_URL=wss://${{ secrets.DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stage 3: Deploy to EC2 (only on main)
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/LiveBackend' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null
      
      - name: 🌐 Create .env file on EC2
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_IP }} << 'EOF'
            cd /home/ubuntu/app
            cat > .env << 'ENVFILE'
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ENGINE_TOKEN=${{ secrets.ENGINE_TOKEN }}
            ENVIRONMENT=production
            LOG_LEVEL=INFO
            REACT_APP_API_URL=https://${{ secrets.DOMAIN }}
            REACT_APP_WS_URL=wss://${{ secrets.DOMAIN }}
            ALLOWED_ORIGINS=https://${{ secrets.DOMAIN }}
            GAME_ADMIN_URL=http://game-admin:8080
            ENVFILE
            chmod 600 .env
          EOF
      
      - name: 🐳 Deploy containers to EC2
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_IP }} << 'EOF'
            cd /home/ubuntu/app
            
            # Pull latest code
            git fetch origin
            git checkout main
            git pull origin main
            
            # Create required directories
            mkdir -p data/{db,redis,certs,logs/nginx}
            
            # Stop and remove old containers
            docker-compose -f docker-compose-prod.yml down || true
            
            # Load environment
            export $(cat .env | xargs)
            
            # Pull and build latest images
            docker-compose -f docker-compose-prod.yml pull
            docker-compose -f docker-compose-prod.yml build --pull
            
            # Start containers
            docker-compose -f docker-compose-prod.yml up -d
            
            # Wait for services to be healthy
            echo "⏳ Waiting for services to be healthy..."
            sleep 15
            
            # Verify deployment
            echo "🔍 Checking service health..."
            curl -f http://localhost:8080/actuator/health > /dev/null 2>&1
            if [ $? -ne 0 ]; then
              echo "❌ GameAdmin health check failed"
              docker-compose -f docker-compose-prod.yml logs game-admin
              exit 1
            fi
            
            curl -f http://localhost:8081/actuator/health > /dev/null 2>&1
            if [ $? -ne 0 ]; then
              echo "❌ GameEngine health check failed"
              docker-compose -f docker-compose-prod.yml logs game-engine
              exit 1
            fi
            
            echo "✅ All services are healthy"
          EOF
      
      - name: 📊 Check domain accessibility
        run: |
          echo "🌐 Checking domain: https://${{ secrets.DOMAIN }}"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.DOMAIN }} || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ]; then
              echo "✅ Domain is accessible (HTTP $STATUS)"
              break
            fi
            echo "⏳ Attempt $i/10 - Status: $STATUS, retrying..."
            sleep 5
          done
      
      - name: 📬 Slack Notification (Success)
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            ✅ *Deployment Successful*
            🌐 Domain: https://${{ secrets.DOMAIN }}
            📦 Commit: ${{ github.sha }}
            👤 Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
      
      - name: 📬 Slack Notification (Failure)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            ❌ *Deployment Failed*
            🔗 Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            👤 Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

