name: Deploy to EC2

on:
  push:
    branches:
      - LiveBackend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy sources to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/app
            git config --global --add safe.directory ~/app || true

      - name: Sync GameAdmin
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "GameAdmin/"
          target: "~/app/"

      - name: Sync GameEngine
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "GameEngine_src/"
          target: "~/app/"

      - name: Sync Frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "quiz-frontend/"
          target: "~/app/"

      - name: Build and restart all services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          command_timeout: 20m
          script: |
            cd ~/app
            docker-compose build gameadmin gameengine frontend
            docker-compose up -d --no-deps gameadmin gameengine frontend
            echo "=== Deploy tamamlandi ==="
            docker-compose ps
