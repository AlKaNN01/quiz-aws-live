name: Deploy to EC2

on:
  push:
    branches:
      - LiveBackend

env:
  REGISTRY: ghcr.io
  GAMEADMIN_IMAGE: ghcr.io/alkan01/quiz-gameadmin
  GAMEENGINE_IMAGE: ghcr.io/alkan01/quiz-gameengine
  FRONTEND_IMAGE: ghcr.io/alkan01/quiz-frontend

jobs:
  # ── 1. Build & push Docker images ────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push GameAdmin
        uses: docker/build-push-action@v6
        with:
          context: ./GameAdmin
          push: true
          tags: ${{ env.GAMEADMIN_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.GAMEADMIN_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.GAMEADMIN_IMAGE }}:cache,mode=max

      - name: Build & push GameEngine
        uses: docker/build-push-action@v6
        with:
          context: ./GameEngine_src
          push: true
          tags: ${{ env.GAMEENGINE_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.GAMEENGINE_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.GAMEENGINE_IMAGE }}:cache,mode=max

      - name: Build & push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./quiz-frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            REACT_APP_API_URL=https://quiz.awsccokan.com
            REACT_APP_WS_URL=https://quiz.awsccokan.com/ws
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:cache,mode=max

  # ── 2. Deploy to EC2 ─────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Pull new images & restart services on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          command_timeout: 10m
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Config dosyalarını güncelle (docker-compose.yml, nginx vb.)
            cd ~/app
            git pull origin LiveBackend

            # Yeni image'ları çek
            docker-compose pull gameadmin gameengine frontend

            # Sırayla yeniden başlat (downtime minimize)
            docker-compose up -d --no-deps gameadmin
            docker-compose up -d --no-deps gameengine
            docker-compose up -d --no-deps frontend

            # Eski image'ları temizle
            docker image prune -f

            docker logout ghcr.io

            echo "=== Deploy tamamlandi ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
