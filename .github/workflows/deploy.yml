name: Deploy to EC2

on:
  push:
    branches:
      - LiveBackend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -q "^GameAdmin/"; then
            echo "gameadmin=true" >> $GITHUB_OUTPUT
          else
            echo "gameadmin=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -q "^GameEngine_src/"; then
            echo "gameengine=true" >> $GITHUB_OUTPUT
          else
            echo "gameengine=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -q "^quiz-frontend/"; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

      - name: Copy GameAdmin sources
        if: steps.changes.outputs.gameadmin == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "GameAdmin/"
          target: "~/app/GameAdmin"
          strip_components: 1

      - name: Copy GameEngine sources
        if: steps.changes.outputs.gameengine == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "GameEngine_src/"
          target: "~/app/GameEngine_src"
          strip_components: 1

      - name: Copy Frontend sources
        if: steps.changes.outputs.frontend == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "quiz-frontend/"
          target: "~/app/quiz-frontend"
          strip_components: 1

      - name: Build and restart changed services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/app

            SERVICES=""
            if [ "${{ steps.changes.outputs.gameadmin }}" == "true" ]; then
              SERVICES="$SERVICES gameadmin"
            fi
            if [ "${{ steps.changes.outputs.gameengine }}" == "true" ]; then
              SERVICES="$SERVICES gameengine"
            fi
            if [ "${{ steps.changes.outputs.frontend }}" == "true" ]; then
              SERVICES="$SERVICES frontend"
            fi

            if [ -z "$SERVICES" ]; then
              echo "Hicbir servis degismedi, deploy atlandi."
              docker-compose ps
              exit 0
            fi

            echo "Deploy edilecek servisler: $SERVICES"
            docker-compose build $SERVICES
            docker-compose up -d --no-deps $SERVICES
            echo "Deploy tamamlandi."
            docker-compose ps
