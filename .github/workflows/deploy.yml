name: Build & Deploy to EC2

on:
  push:
    branches:
      - LiveBackend
  pull_request:
    branches:
      - LiveBackend
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gameadmin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run GameAdmin tests
        run: cd GameAdmin && mvn clean test -q
        env:
          DB_PASSWORD: postgres
          DB_URL: jdbc:postgresql://localhost:5432/gameadmin
          DB_USER: postgres
          ALLOWED_ORIGINS: http://localhost:3000,https://quiz.awsccokan.com

      - name: Run GameEngine tests
        run: cd GameEngine_src && mvn clean test -q
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-key-32-chars-minimum
          ENGINE_TOKEN: ci-test-engine-token
          ALLOWED_ORIGINS: http://localhost:3000
          GAME_ADMIN_URL: http://localhost:8080

      - name: Build GameAdmin JAR
        run: cd GameAdmin && mvn clean package -DskipTests -q

      - name: Build GameEngine JAR
        run: cd GameEngine_src && mvn clean package -DskipTests -q

      - name: Build Frontend
        run: cd quiz-frontend && npm install --legacy-peer-deps && npm run build

      - name: Verify Docker builds
        run: |
          docker build -f GameAdmin/Dockerfile -t quiz-admin:test GameAdmin/
          docker build -f GameEngine_src/Dockerfile -t quiz-engine:test GameEngine_src/
          docker build -f quiz-frontend/Dockerfile -t quiz-frontend:test quiz-frontend/

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/LiveBackend' && github.event_name == 'push'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy .env to EC2
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          printf "DB_PASSWORD=%s\nREDIS_PASSWORD=%s\nJWT_SECRET=%s\nENGINE_TOKEN=%s\nENVIRONMENT=production\nLOG_LEVEL=INFO\nREACT_APP_API_URL=https://%s\nREACT_APP_WS_URL=wss://%s\nALLOWED_ORIGINS=https://%s\nGAME_ADMIN_URL=http://game-admin:8080\n" \
            "$DB_PASSWORD" "$REDIS_PASSWORD" "$JWT_SECRET" "$ENGINE_TOKEN" \
            "$DOMAIN" "$DOMAIN" "$DOMAIN" > /tmp/prod.env
          scp -i ~/.ssh/id_rsa /tmp/prod.env ubuntu@${{ secrets.EC2_IP }}:/home/ubuntu/app/.env

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_IP }} 'set -e
            cd /home/ubuntu/app
            chmod 600 .env
            git fetch origin
            git checkout LiveBackend
            git pull origin LiveBackend
            mkdir -p data/db data/redis data/certs data/logs/nginx
            docker-compose -f docker-compose-prod.yml down || true
            docker-compose -f docker-compose-prod.yml up -d --build
            echo "Waiting for services to become healthy..."
            for i in $(seq 1 24); do
              sleep 5
              ADMIN_OK=$(curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1 && echo "yes" || echo "no")
              ENGINE_OK=$(curl -sf http://localhost:8081/actuator/health > /dev/null 2>&1 && echo "yes" || echo "no")
              echo "Attempt $i/24 — GameAdmin: $ADMIN_OK, GameEngine: $ENGINE_OK"
              if [ "$ADMIN_OK" = "yes" ] && [ "$ENGINE_OK" = "yes" ]; then
                echo "All services healthy"
                exit 0
              fi
            done
            echo "=== Services not healthy after 2 minutes ==="
            docker-compose -f docker-compose-prod.yml logs --tail=40 game-admin
            docker-compose -f docker-compose-prod.yml logs --tail=40 game-engine
            exit 1'

      - name: Check domain
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.DOMAIN }} || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "Domain accessible (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i/10 - HTTP $STATUS, retrying..."
            sleep 5
          done
          echo "Domain check inconclusive - deploy may still be starting"
